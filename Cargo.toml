[workspace]
members = ["."]
exclude = ["examples"]

[package]
name = "tauri-plugin-nostr-sync"
version = "0.1.0-alpha.1"
authors = ["dkackman"]
description = "Encrypted decentralized state sync via Nostr for Tauri apps"
edition = "2021"
rust-version = "1.77.2"
license = "Apache-2.0"
repository = "https://github.com/dkackman/tauri-plugin-nostr"
homepage = "https://github.com/dkackman/tauri-plugin-nostr"
documentation = "https://docs.rs/tauri-plugin-nostr-sync"
readme = "README.md"
keywords = ["nostr", "tauri", "sync", "plugin", "nip44"]
categories = ["network-programming", "cryptography"]
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-nostr-sync"

[dependencies]
tauri = { version = "2.5.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
nostr-sdk = { version = "0.44.1", features = ["nip44"] }
tokio = { version = "1.52.2", features = ["sync", "rt", "macros"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
futures = "0.3"
tauri = { version = "2.5.0", features = ["test"] }
tokio = { version = "1.52.2", features = ["sync", "rt", "macros", "test-util"] }

[build-dependencies]
tauri-plugin = { version = "2.2.0", features = ["build"] }
